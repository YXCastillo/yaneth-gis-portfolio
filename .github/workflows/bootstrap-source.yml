name: Import portfolio source

on:
  push:
    paths:
      - site-source.zip.part-*

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          cat site-source.zip.part-* > site-source.zip
          unzip -o site-source.zip
          rm site-source.zip site-source.zip.part-*
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import ChatGPT Sites portfolio source"
          git push
